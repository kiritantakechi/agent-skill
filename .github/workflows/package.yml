# Every skill as the zip a skill upload takes: one folder named after the
# skill, `SKILL.md` directly in it. `agent-skill build` writes them, so what a
# package holds has one owner, `build.shipped`. A release tag attaches each zip
# to the tag's release, one asset per skill; a dispatch uploads them as one
# artifact. The setup steps are python-style's, which `self-application` holds.
name: package

on:
  push: { tags: ["style-standards--v*"] }
  workflow_dispatch:

# Read the repository and nothing else; the job that publishes asks for more.
permissions:
  contents: read

env:
  # uv.lock is committed, and CI installs exactly what it pins.
  UV_FROZEN: "1"

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write  # attach the zips to the tag's release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with: { version: "0.13.7" }
      - run: uv python install cpython-3.15.2+freethreaded
      - run: uv sync --group dev
      - run: uv run agent-skill build --out dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with: { name: skills, path: dist/*.zip, if-no-files-found: error }
      # The release is created if the tag has none, and each zip replaces its
      # namesake, so running the tag's job again republishes rather than fails.
      - if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" > /dev/null 2>&1 || gh release create "$TAG" --verify-tag --title "$TAG" --notes "Each zip is one skill, ready to upload: a folder named after the skill, SKILL.md directly in it. bevy-style is a delta on rust-style and is read with it."
          gh release upload "$TAG" dist/*.zip --clobber
