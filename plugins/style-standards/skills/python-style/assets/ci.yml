# Minimal CI that enforces this standard. Every tool is pinned to the exact
# version the standard was verified against; a bump is a reviewed change, not a
# resolver decision. Referenced by the build chapter.
name: ci

on:
  push: { branches: [main] }
  pull_request:

# Read the repository and nothing else. A job that needs more asks for it.
permissions:
  contents: read

env:
  # The project commits uv.lock (PS-BUILD-10) and CI installs exactly what it
  # pins: without the lock file, `uv sync` fails rather than resolving afresh.
  UV_FROZEN: "1"

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with: { version: "0.13.7" }
      # The free-threaded build is a separate interpreter, not a flag.
      - run: uv python install cpython-3.15.2+freethreaded
      - run: uv sync --group dev
      - run: uv run pytest
      # The build first, then the runtime with the package imported: the GIL
      # can be re-enabled at import time, process-wide, permanently and with
      # only a RuntimeWarning, so one unported dependency silently costs the
      # whole feature (PS-BUILD-19). `acmewidget` is the template's package.
      - run: uv run python -c "import sys; assert sys.abi_info.free_threaded"
      - run: uv run python -c "import sys, acmewidget; assert not sys._is_gil_enabled()"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with: { version: "0.13.7" }
      - run: uv python install cpython-3.15.2+freethreaded
      - run: uv sync --group dev
      - run: uv run ruff check
      # ruff warns here about some enabled lint rules that conflict with the
      # formatter, not all; ruff.toml disables its whole documented list.
      - run: uv run ruff format --check
      - run: uv run ty check
