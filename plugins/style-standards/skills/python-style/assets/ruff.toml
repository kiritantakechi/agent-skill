# Validated against ruff 0.17.3. Pin this version: `select = ["ALL"]` means a
# release that adds a rule changes what your build enforces.
target-version = "py315"
line-length = 88
indent-width = 4
src = ["src", "tests"]

output-format = "concise"

[lint]
# Stable rules only. Preview rules move between releases, and py315 needs no
# preview since 0.17. A rule this standard cites is one this file enables.
select = ["ALL"]

ignore = [
  # Ruff's own documented formatter-conflict list.
  # https://docs.astral.sh/ruff/formatter/#conflicting-lint-rules
  "W191", "E111", "E114", "E117",  # indentation is the formatter's job
  "D206", "D300",                  # docstring indent and quotes likewise
  "Q000", "Q001", "Q002", "Q003", "Q004",
  "COM812", "COM819",
  "ISC002",
  # ISC001 is deliberately NOT ignored: ruff recommends enabling it, and it is
  # not on the conflict list despite older documentation saying so.
  # E501 is deliberately NOT ignored: the formatter makes only a best-effort
  # attempt at the line limit, so E501 is the backstop that catches the rest.

  # Mutually exclusive pairs. Ruff drops one and says which in a warning; choose
  # deliberately instead. D211 and D212 are the formatter-compatible side.
  "D203",
  "D213",

  # Redundant with the formatter.
  "D207", "D208",

  # Policy, not correctness.
  "CPY001",
]

[lint.pycodestyle]
# PEP 8's 72 for docstring and comment prose, which the formatter does not wrap.
# W505 is in `ALL` and does nothing until this is set.
max-doc-length = 72

[lint.flake8-pytest-style]
# A `pytest.raises` without `match=` passes on the wrong exception of the right
# type. The default list names only the broad builtins; every type needs it.
raises-require-match-for = ["*"]

[lint.flake8-implicit-str-concat]
# Safe only because ISC001 is enabled; the two are documented as a pair.
allow-multiline = false

[lint.pydocstyle]
# The only convention that keeps D417 (undocumented-param). Leaving it unset
# enables mutually contradictory rules.
convention = "google"

[lint.flake8-type-checking]
# At py315 a TC001-TC003 fix makes a single-name import `lazy`, which keeps it
# at module scope and resolves it on first use — the spelling this standard asks
# for. Where it cannot, the fix moves the import into TYPE_CHECKING and leaves the
# annotation unquoted, because PEP 649 made annotations lazy; anything resolving
# annotations at runtime then breaks. Name those bases and decorators here.
runtime-evaluated-base-classes = [
  "pydantic.BaseModel",
  "sqlalchemy.orm.DeclarativeBase",
]
runtime-evaluated-decorators = [
  "attrs.define",
  "pydantic.validate_call",
]

[lint.per-file-ignores]
# S101 makes flake8-bandit unusable in a pytest suite. D103: a test's name is its
# specification (PS-TEST-06), so a docstring would only say it twice.
"tests/**/*.py" = ["S101", "S105", "S106", "S107", "PLR2004", "SLF001", "INP001", "D103"]
"**/conftest.py" = ["INP001"]

[format]
preview = false            # keep the stable formatter style
quote-style = "double"
indent-style = "space"
line-ending = "lf"         # "auto" is detected per file, so it is not reproducible
docstring-code-format = true
skip-magic-trailing-comma = false
