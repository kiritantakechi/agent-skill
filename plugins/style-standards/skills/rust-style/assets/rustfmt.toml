# Keep this file short. Every override is a cost to new contributors.
# The two below are worth it, and both are nightly-only: stable rustfmt warns
# "can't set …, unstable features are only available in nightly channel" and
# ignores them. Format with `cargo +nightly fmt`, locally as in assets/ci.yml,
# or delete both lines and use the pinned toolchain's `cargo fmt` everywhere.
# Referenced by RS-MOD-34, RS-MOD-35, RS-BUILD-26.

group_imports = "StdExternalCrate"   # std / external / crate, blank-line separated
imports_granularity = "Crate"        # merge `use` statements per crate
