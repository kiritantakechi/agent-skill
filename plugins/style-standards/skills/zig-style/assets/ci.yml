# CI gate for a Zig 0.17 project. Referenced by ZS-BUILD-23, ZS-BUILD-25, ZS-BUILD-26.
#
# The five requirements ZS-BUILD-26 imposes:
#   1. Pin the exact Zig version. Never `latest`, never `master`, never a range.
#   2. Gate on `zig fmt --check --ast-check`, excluding `zig-pkg` and `.zig-cache`.
#   3. Run the suite in the `debug` and `safe` modes, with `--summary all` so a cached no-op
#      is distinguishable from a real pass.
#   4. Cross-compile matrix: build AND `zig build test` each supported triple. The test binaries
#      compile and the runs report `skipped` — that is the point (ZS-BUILD-25).
#   5. The cache key must name every matrix axis, or the legs evict each other.

name: ci

on:
  push: { branches: [main] }
  pull_request:

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29  # v2.2.1
        with: { version: 0.17.0 }         # pinned exactly — never `latest`
      - run: zig fmt --check --ast-check --exclude zig-pkg --exclude .zig-cache .

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        optimize: [debug, safe]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29  # v2.2.1
        with:
          version: 0.17.0
          # The cache key names every matrix axis this job declares.
          cache-key: ${{ matrix.os }}-${{ matrix.optimize }}
      - run: zig build --fetch            # dependency resolution as its own step
      - run: zig build test -Doptimize=${{ matrix.optimize }} --summary all
      - run: zig build test-integration -Doptimize=${{ matrix.optimize }} --summary all

  cross:
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-linux-musl
          - aarch64-linux-musl
          - x86_64-macos
          - aarch64-macos
          - x86_64-windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29  # v2.2.1
        with:
          version: 0.17.0
          cache-key: cross-${{ matrix.target }}
      - run: zig build -Dtarget=${{ matrix.target }} --summary all
      # The run reports `skipped` for foreign targets; compiling the test binary is the check.
      - run: zig build test -Dtarget=${{ matrix.target }} --summary all
