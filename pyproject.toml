[project]
name = "agent-skill"
version = "0.1.0"
description = "Build and verify Claude Code skills"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "kiritantakechi", email = "kiritantakechi@gmail.com" }
]
requires-python = ">=3.15"
dependencies = []

[project.scripts]
agent-skill = "agent_skill.cli:main"

[build-system]
requires = ["uv_build>=0.13.3,<0.14"]
build-backend = "uv_build"

[dependency-groups]
# ruff and ty are pinned exactly, not floored: every measurement this repository
# makes about their catalogues was taken at these versions, and ty states that
# breaking changes — including changes to diagnostics — may occur between any
# two releases. Moving either pin is a reviewed event, not a resolver decision.
dev = ["pytest==9.2.0", "ruff==0.17.4", "ty==0.0.99", "ripgrep-bin==15.2.0"]

[tool.ruff]
# The configuration is the one python-style ships. Paths in an extended file
# resolve against that file's directory, so `src` and the per-file globs are
# restated here, where they name this repository's directories.
extend = "plugins/style-standards/skills/python-style/assets/ruff.toml"
src = ["src", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106", "S107", "PLR2004", "SLF001", "INP001", "D103"]
"**/conftest.py" = ["INP001"]
# The one relaxation: the report a run prints is the program's output, which
# T201 does not mean; it is for diagnostics written with `print`.
"src/agent_skill/cli.py" = ["T201"]

[tool.pytest]
testpaths = ["tests"]
strict = true
markers = [
    "toolchain: needs cargo, zig, or the pinned free-threaded Python; slow, and must run alone",
]
