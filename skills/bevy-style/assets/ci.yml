# CI for a Bevy 0.20 game. Referenced by BV-BUILD-05, BV-BUILD-17,
# BV-BUILD-18 and BV-BUILD-20, and by BV-ARCH-07 for the boundary job.
name: ci

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_WARNINGS: deny

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # Bevy is most of the build and changes only when the pin changes.
      - uses: Swatinem/rust-cache@v2
      # Bevy needs these to build on Linux; without them the job fails in the
      # dependency build with a linker error that names nothing useful.
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # Two Bevy versions in the tree are two engines, and the type errors name
      # neither. See BV-BUILD-05.
      - name: One Bevy version
        run: |
          # No trailing space: `^bevy ` would match only the facade, and the
          # usual way two engines get into a tree is a plugin depending on
          # `bevy_ecs` directly. BV-BUILD-05 asks about anything named bevy.
          if cargo tree --duplicates | grep -q '^bevy'; then
            cargo tree --duplicates | grep '^bevy'
            echo 'more than one bevy version in the tree; see BV-BUILD-05' >&2
            exit 1
          fi
      # The rules of the game may not name the engine. See BV-ARCH-01.
      - name: The boundary holds
        run: |
          if grep -rn --include='*.rs' -e 'bevy' crates/*-sim/src/; then
            echo 'a simulation crate named Bevy; see BV-ARCH-01' >&2
            exit 1
          fi

  shipped-features:
    # Building only the default feature set proves nothing about the artefact.
    # This list is the one in the release manifest. See BV-BUILD-17.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - run: cargo build --release --no-default-features --features shipping

  docs:
    # `CARGO_BUILD_WARNINGS` above denies rustdoc's lints too, but only if something runs rustdoc.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - run: cargo doc --no-deps --workspace

  msrv:
    # The manifest's `rust-version` is a claim; this is what makes it true.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99        # must match `rust-version`
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - run: cargo check --workspace

  wasm:
    # Only if the game ships to the web. See BV-BUILD-18.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --target wasm32-unknown-unknown --no-default-features --features web
