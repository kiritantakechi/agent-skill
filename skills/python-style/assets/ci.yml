# Minimal CI that enforces this standard. Every tool is pinned to the exact
# version the standard was verified against; a bump is a reviewed change, not a
# resolver decision. Referenced by the build chapter.
name: ci

on:
  push: { branches: [main] }
  pull_request:

env:
  UV_FROZEN: "1"

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with: { version: "0.13.3" }
      # The free-threaded build is a separate interpreter, not a flag.
      - run: uv python install cpython-3.15.0+freethreaded
      - run: uv sync --group dev
      - run: uv run pytest
      # The build first, then the runtime with the package imported: the GIL
      # can be re-enabled at import time, process-wide, permanently and with
      # only a RuntimeWarning, so one unported dependency silently costs the
      # whole feature (PS-BUILD-20). Replace `yourpkg` with the package.
      - run: uv run python -c "import sys; assert sys.abi_info.free_threaded"
      - run: uv run python -c "import sys, yourpkg; assert not sys._is_gil_enabled()"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with: { version: "0.13.3" }
      - run: uv python install cpython-3.15.0+freethreaded
      - run: uv sync --group dev
      - run: uv run ruff check
      # Zero stderr here is ruff's own proof that no enabled lint rule conflicts
      # with the formatter.
      - run: uv run ruff format --check
      - run: uv run ty check
